<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item active" href="view.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
      <span class="app-nav-text" data-i18n="navPerfView"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="10" x2="10" y2="20"/></svg>
      <span class="app-nav-text" data-i18n="navTargetTable"></span>
    </a>
    <a class="app-nav-item" href="admin-kpi.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navKpi"></span>
    </a>
    <a class="app-nav-item" href="insights.html" data-nav="insights">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
      <span class="app-nav-text" data-i18n="navInsights"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
<main>
  <div class="card">
    <div class="context-bar" id="contextBar"></div>
    <div class="form-grid" id="officeSelectWrap">
      <div>
        <label data-i18n="office"></label>
        <select id="officeSelect"></select>
      </div>
    </div>
    <div class="period-toggle" id="periodToggle">
      <button class="period-btn period-active" data-period="month" data-i18n="periodMonth">월간</button>
      <button class="period-btn" data-period="quarter" data-i18n="periodQuarter">분기</button>
      <button class="period-btn" data-period="year" data-i18n="periodYear">연간</button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="profitHeading" style="font-size:18px;"></h2>
    <div class="chart-wrap"><canvas id="profitChart"></canvas></div>
    <div class="table-wrap">
      <table class="exp-table" id="profitTable">
        <thead>
          <tr>
            <th data-i18n="colMonth"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colOperatingProfitKr"></th>
            <th data-i18n="colNetProfit"></th>
            <th data-i18n="colOperatingMarginPct"></th>
            <th data-i18n="colNetMarginPct"></th>
          </tr>
        </thead>
        <tbody id="profitBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="stabilityHeading" style="font-size:18px;"></h2>
    <div class="table-wrap">
      <table class="exp-table" id="stabilityTable">
        <thead>
          <tr>
            <th data-i18n="colMonth"></th>
            <th data-i18n="colDebtRatio"></th>
            <th data-i18n="colCurrentRatio"></th>
          </tr>
        </thead>
        <tbody id="stabilityBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="budgetHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="budgetHeadingDesc"></p>
    <div class="metric-cards">
      <div class="metric-card"><div class="label" data-i18n="targetProfitLabel"></div><div class="value" id="targetProfitCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="actualProfitLabel"></div><div class="value" id="actualProfitCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="achievementLabel"></div><div class="value" id="profitAchievementPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="gaBudgetLabel"></div><div class="value" id="gaBudgetCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="gaActualLabel"></div><div class="value" id="gaActualCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="achievementLabel"></div><div class="value" id="gaAchievementPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colSalesMarginPct"></div><div class="value" id="salesMarginPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colOperatingMarginPct"></div><div class="value" id="operatingMarginPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colNetMarginPct"></div><div class="value" id="netMarginPct">-</div></div>
    </div>
  </div>

  <div class="card" id="fundCard">
    <h2 data-i18n="fundHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="fundCorpOnlyNote"></p>
    <div class="metric-cards">
      <div class="metric-card"><div class="label" data-i18n="endingCny"></div><div class="value" id="fundEndingCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="prevEndingCny"></div><div class="value" id="fundPrevEndingCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="cashChangePct"></div><div class="value" id="fundChangePct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="totalLoanBalanceCny"></div><div class="value" id="fundLoanBalance">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="dividendAvailableCny"></div><div class="value" id="fundDividend">-</div></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="targetPerfHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="targetPerfDesc"></p>
    <p class="desc" id="targetPerfPeriodLabel" style="font-weight:600;"></p>
    <div class="table-wrap">
      <table class="exp-table" id="targetPerfTable">
        <thead>
          <tr>
            <th data-i18n="colPeriod"></th>
            <th data-i18n="colTargetProfitCny"></th>
            <th data-i18n="colOperatingProfitKr"></th>
            <th data-i18n="colOverAchievedCny"></th>
            <th data-i18n="colAchievementRate"></th>
            <th data-i18n="colHeadcount"></th>
            <th data-i18n="colProductivity"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colCostOfSalesCny"></th>
            <th data-i18n="colSalesProfitCny"></th>
            <th data-i18n="colGaExpenseCny"></th>
            <th data-i18n="colEntertainmentCny"></th>
            <th data-i18n="colTravelCny"></th>
            <th data-i18n="colNetProfit"></th>
          </tr>
        </thead>
        <tbody id="targetPerfBody"></tbody>
      </table>
    </div>
  </div>
    </main>
    <footer>실적분석 · China Branch Performance Analysis</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-insights.js"></script>
<script src="js/common.js"></script>
<script src="js/app-view.js"></script>
</body>
</html>
