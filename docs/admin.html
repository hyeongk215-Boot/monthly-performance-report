<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">실적분석</h1>
  <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <nav class="nav-links">
      <a href="index.html" data-i18n="backBtn">← 뒤로</a>
    </nav>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="targetPerfAdminHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="targetPerfAdminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="corp"></label>
        <select id="reportCorp"></select>
      </div>
      <div>
        <label data-i18n="office"></label>
        <select id="reportOffice"></select>
      </div>
      <div>
        <label data-i18n="yearmonth"></label>
        <select id="reportYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchReportBtn" data-i18n="adminFetch"></button>
      <button class="btn-secondary" id="downloadReportBtn" data-i18n="adminDownload"></button>
    </div>

    <h3 style="font-size:14px;" id="reportCurrentLabel"></h3>
    <div class="table-wrap">
      <table class="exp-table" id="reportCurrentTable">
        <thead>
          <tr>
            <th data-i18n="office"></th>
            <th data-i18n="colTargetProfitCny"></th>
            <th data-i18n="colOperatingProfit"></th>
            <th data-i18n="colOverAchievedCny"></th>
            <th data-i18n="colAchievementRate"></th>
            <th data-i18n="colHeadcount"></th>
            <th data-i18n="colProductivity"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colCostOfSalesCny"></th>
            <th data-i18n="colSalesProfitCny"></th>
            <th data-i18n="colGaExpenseCny"></th>
            <th data-i18n="colEntertainmentCny"></th>
            <th data-i18n="colTravelCny"></th>
            <th data-i18n="colNetProfit"></th>
          </tr>
        </thead>
        <tbody id="reportCurrentBody"></tbody>
      </table>
    </div>

    <h3 style="font-size:14px;" id="reportPrevLabel"></h3>
    <div class="table-wrap">
      <table class="exp-table" id="reportPrevTable">
        <thead>
          <tr>
            <th data-i18n="office"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colCostOfSalesCny"></th>
            <th data-i18n="colSalesProfitCny"></th>
            <th data-i18n="colGaExpenseCny"></th>
            <th data-i18n="colEntertainmentCny"></th>
            <th data-i18n="colTravelCny"></th>
            <th data-i18n="colOperatingProfit"></th>
            <th data-i18n="colNetProfit"></th>
          </tr>
        </thead>
        <tbody id="reportPrevBody"></tbody>
      </table>
    </div>

    <h3 style="font-size:14px;" data-i18n="reportYoyHeading"></h3>
    <div class="table-wrap">
      <table class="exp-table" id="reportYoyTable">
        <thead>
          <tr>
            <th data-i18n="office"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colCostOfSalesCny"></th>
            <th data-i18n="colSalesProfitCny"></th>
            <th data-i18n="colGaExpenseCny"></th>
            <th data-i18n="colEntertainmentCny"></th>
            <th data-i18n="colTravelCny"></th>
            <th data-i18n="colOperatingProfit"></th>
            <th data-i18n="colNetProfit"></th>
          </tr>
        </thead>
        <tbody id="reportYoyBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="aggHeading" style="font-size:18px;"></h2>
    <div class="chart-wrap"><canvas id="aggChart"></canvas></div>
    <div class="table-wrap">
      <table class="exp-table" id="aggTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="colCorp"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colOperatingMarginPct"></th>
            <th data-i18n="colNetMarginPct"></th>
            <th data-i18n="colDebtRatio"></th>
            <th data-i18n="colCurrentRatio"></th>
            <th data-i18n="achievementLabel"></th>
            <th data-i18n="cashChangePct"></th>
            <th data-i18n="totalLoanBalanceCny"></th>
          </tr>
        </thead>
        <tbody id="aggBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="downloadBtn" data-i18n="adminDownload"></button>
    </div>
  </div>
</main>
<footer>실적분석 · China Branch Performance Analysis</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
