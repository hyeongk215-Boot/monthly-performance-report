<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">실적분석</h1>
  <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <nav class="nav-links">
      <a href="admin-kpi.html" data-i18n="navKpi">경영지표 페이지</a>
      <a href="index.html" data-i18n="backBtn">← 뒤로</a>
    </nav>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="targetPerfAdminHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="targetPerfAdminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="corpGroupLabel"></label>
        <select id="reportGroup">
          <option value="yjc" data-i18n="corpGroupYjc"></option>
          <option value="other" data-i18n="corpGroupOther"></option>
        </select>
      </div>
      <div>
        <label data-i18n="reportModeLabel"></label>
        <select id="reportMode">
          <option value="all" data-i18n="reportModeAll"></option>
          <option value="office" data-i18n="reportModeOffice"></option>
        </select>
      </div>
      <div>
        <label data-i18n="yearLabel"></label>
        <select id="reportYear"></select>
      </div>
      <div id="reportPeriodTypeWrap">
        <label data-i18n="periodLabel"></label>
        <select id="reportPeriodType">
          <option value="month" data-i18n="periodMonth"></option>
          <option value="quarter" data-i18n="periodQuarter"></option>
          <option value="half" data-i18n="periodHalf"></option>
          <option value="annual" data-i18n="periodYear"></option>
        </select>
      </div>
      <div id="reportPeriodValueWrap">
        <label data-i18n="periodValueLabel"></label>
        <select id="reportPeriodValue"></select>
      </div>
      <div id="reportOfficeWrap" style="display:none;">
        <label data-i18n="office"></label>
        <select id="reportOfficeSel"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchReportBtn" data-i18n="adminFetch"></button>
      <button class="btn-secondary" id="downloadReportBtn" data-i18n="adminDownload"></button>
    </div>
    <div id="reportMeta" style="font-size:13px; color:var(--muted); margin:10px 0;"></div>

    <div id="groupModeWrap">
      <h3 style="font-size:14px; margin-top:18px;" id="reportCurrentLabel"></h3>
      <div class="table-wrap"><table class="exp-table" id="reportCurrentTable"><thead></thead><tbody></tbody></table></div>

      <h3 style="font-size:14px; margin-top:18px;" id="reportPrevLabel"></h3>
      <div class="table-wrap"><table class="exp-table" id="reportPrevTable"><thead></thead><tbody></tbody></table></div>

      <h3 style="font-size:14px; margin-top:18px;" data-i18n="reportYoyHeading"></h3>
      <div class="table-wrap"><table class="exp-table" id="reportYoyTable"><thead></thead><tbody></tbody></table></div>
    </div>

    <div id="officeModeWrap" style="display:none;">
      <div class="table-wrap">
        <table class="exp-table" id="officeSeriesTable">
          <thead>
            <tr>
              <th data-i18n="colPeriod"></th>
              <th data-i18n="colTargetProfitCny"></th>
              <th data-i18n="colOperatingProfitKr"></th>
              <th data-i18n="colOverAchievedCny"></th>
              <th data-i18n="colAchievementRate"></th>
              <th data-i18n="colHeadcount"></th>
              <th data-i18n="colProductivity"></th>
              <th data-i18n="colRevenue"></th>
              <th data-i18n="colCostOfSalesCny"></th>
              <th data-i18n="colSalesProfitCny"></th>
              <th data-i18n="colGaExpenseCny"></th>
              <th data-i18n="colEntertainmentCny"></th>
              <th data-i18n="colTravelCny"></th>
              <th data-i18n="colNetProfit"></th>
            </tr>
          </thead>
          <tbody id="officeSeriesBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<footer>실적분석 · China Branch Performance Analysis</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
