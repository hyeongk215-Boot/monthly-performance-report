<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item" href="view.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
      <span class="app-nav-text" data-i18n="navPerfView"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item active" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="10" x2="10" y2="20"/></svg>
      <span class="app-nav-text" data-i18n="navTargetTable"></span>
    </a>
    <a class="app-nav-item" href="admin-kpi.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navKpi"></span>
    </a>
    <a class="app-nav-item" href="insights.html" data-nav="insights">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
      <span class="app-nav-text" data-i18n="navInsights"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="targetPerfAdminHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="targetPerfAdminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="corpGroupLabel"></label>
        <select id="reportGroup">
          <option value="yjc" data-i18n="corpGroupYjc"></option>
          <option value="other" data-i18n="corpGroupOther"></option>
        </select>
      </div>
      <div>
        <label data-i18n="reportModeLabel"></label>
        <select id="reportMode">
          <option value="all" data-i18n="reportModeAll"></option>
          <option value="office" data-i18n="reportModeOffice"></option>
        </select>
      </div>
      <div>
        <label data-i18n="yearLabel"></label>
        <select id="reportYear"></select>
      </div>
      <div id="reportPeriodTypeWrap">
        <label data-i18n="periodLabel"></label>
        <select id="reportPeriodType">
          <option value="month" data-i18n="periodMonth"></option>
          <option value="quarter" data-i18n="periodQuarter"></option>
          <option value="half" data-i18n="periodHalf"></option>
          <option value="annual" data-i18n="periodYear"></option>
        </select>
      </div>
      <div id="reportPeriodValueWrap">
        <label data-i18n="periodValueLabel"></label>
        <select id="reportPeriodValue"></select>
      </div>
      <div id="reportOfficeWrap" style="display:none;">
        <label data-i18n="office"></label>
        <select id="reportOfficeSel"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchReportBtn" data-i18n="adminFetch"></button>
      <button class="btn-secondary" id="downloadReportBtn" data-i18n="adminDownload"></button>
    </div>
    <div id="reportMeta" style="font-size:13px; color:var(--muted); margin:10px 0;"></div>
    <div class="unit-note" data-i18n="unitLocalCurrency"></div>

    <div id="groupModeWrap">
      <h3 style="font-size:14px; margin-top:18px;" id="reportCurrentLabel"></h3>
      <div class="table-wrap"><table class="exp-table num-table" id="reportCurrentTable"><thead></thead><tbody></tbody></table></div>

      <h3 style="font-size:14px; margin-top:18px;" id="reportPrevLabel"></h3>
      <div class="table-wrap"><table class="exp-table num-table" id="reportPrevTable"><thead></thead><tbody></tbody></table></div>

      <h3 style="font-size:14px; margin-top:18px;" data-i18n="reportYoyHeading"></h3>
      <div class="table-wrap"><table class="exp-table num-table" id="reportYoyTable"><thead></thead><tbody></tbody></table></div>
    </div>

    <div id="officeModeWrap" style="display:none;">
      <div class="table-wrap">
        <table class="exp-table num-table" id="officeSeriesTable">
          <thead>
            <tr>
              <th data-i18n="colPeriod"></th>
              <th data-i18n="colTargetProfitCny"></th>
              <th data-i18n="colOperatingProfitKr"></th>
              <th data-i18n="colOverAchievedCny"></th>
              <th data-i18n="colAchievementRate"></th>
              <th data-i18n="colHeadcount"></th>
              <th data-i18n="colProductivity"></th>
              <th data-i18n="colRevenue"></th>
              <th data-i18n="colCostOfSalesCny"></th>
              <th data-i18n="colSalesProfitCny"></th>
              <th data-i18n="colGaExpenseCny"></th>
              <th data-i18n="colEntertainmentCny"></th>
              <th data-i18n="colTravelCny"></th>
              <th data-i18n="colOperatingProfitKr"></th>
              <th data-i18n="colNetProfit"></th>
            </tr>
          </thead>
          <tbody id="officeSeriesBody"></tbody>
        </table>
      </div>
    </div>
  </div>
    </main>
    <footer>실적분석 · China Branch Performance Analysis</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
