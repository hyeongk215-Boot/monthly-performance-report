<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/insights-theme.css">
</head>
<body>
<div id="insightsApp">
  <div class="ins-shell">
    <aside class="ins-sidebar">
      <div class="ins-brand"><span class="ins-dot" aria-hidden="true"></span><span class="ins-brand-text" data-i18n="appTitle">실적분석</span></div>

      <div class="ins-nav-label">기존 화면</div>
      <a class="ins-nav-item" href="view.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="ins-nav-text" data-i18n="insNavOverview">실적 개요</span>
      </a>

      <div class="ins-nav-label">신규 추가</div>
      <a class="ins-nav-item on" href="insights.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="16"/><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
        <span class="ins-nav-text" data-i18n="insightsHeading">회계 상세분석</span>
      </a>

      <div class="ins-sidebar-foot">
        <button class="ins-icon-btn" id="darkToggle" aria-label="다크모드 전환">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="ins-lang-btn ins-lang-toggle" data-lang="ko">한</button>
        <button class="ins-lang-btn ins-lang-toggle" data-lang="zh">中</button>
      </div>
    </aside>

    <div class="ins-main">
      <div class="ins-topbar">
        <span class="ins-crumb" data-i18n="insightsHeading">회계 상세분석</span>
        <span class="ins-chip"><b id="corpChipLabel"></b></span>
        <span class="ins-chip" id="officeChipWrap">
          <select id="officeSelect"></select>
        </span>
        <span class="ins-chip">
          <select id="ymSwitch"></select>
        </span>
        <div class="ins-segment" id="periodToggle">
          <button class="on" data-period="month" data-i18n="periodMonth">월간</button>
          <button data-period="quarter" data-i18n="periodQuarter">분기</button>
          <button data-period="year" data-i18n="periodYear">연간</button>
        </div>
      </div>
      <div class="ins-export-row">
        <button class="ins-btn" id="exportPdfBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span data-i18n="exportPdf">PDF로 저장</span>
        </button>
        <button class="ins-btn" id="exportPptBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
          <span data-i18n="exportPpt">PPT로 저장</span>
        </button>
      </div>

      <div class="ins-body" id="captureArea">
        <p class="ins-desc" data-i18n="insightsDesc"></p>

        <div class="ins-stat-grid">
          <div class="ins-card">
            <p class="ins-stat-label" data-i18n="wfRevenue"></p>
            <p class="ins-stat-value" id="statRevenue">-</p>
            <span class="ins-badge neutral" id="statRevenueBadge"></span>
          </div>
          <div class="ins-card">
            <p class="ins-stat-label" data-i18n="wfOperatingProfit"></p>
            <p class="ins-stat-value" id="statOperatingProfit">-</p>
            <span class="ins-badge neutral" id="statOperatingMarginBadge"></span>
          </div>
          <div class="ins-card">
            <p class="ins-stat-label" data-i18n="statGaExecPct"></p>
            <p class="ins-stat-value" id="statGaExecPct">-</p>
            <div class="ins-progress"><div id="statGaExecBar" style="width:0%;"></div></div>
          </div>
        </div>

        <div class="ins-chart-grid">
          <div class="ins-card">
            <p class="ins-chart-title" data-i18n="waterfallHeading"></p>
            <div class="ins-chart-box" id="waterfallWrap"></div>
            <div class="ins-summary-row" id="waterfallSummary"></div>
          </div>
          <div class="ins-card">
            <p class="ins-chart-title" data-i18n="gaChartTitleDonut"></p>
            <div class="ins-chart-box" id="gaDonutWrap"></div>
          </div>
        </div>

        <div class="ins-card" style="margin-bottom:14px;">
          <p class="ins-chart-title" data-i18n="stabilityChartHeading"></p>
          <p class="ins-desc" style="margin-bottom:10px;" data-i18n="stabilityChartDesc"></p>
          <div class="ins-chart-box small" id="stabilityWrap"></div>
        </div>

        <div class="ins-card">
          <p class="ins-chart-title" data-i18n="gaChartTitleBar"></p>
          <div class="ins-chart-box small" id="gaBarWrap"></div>
          <div class="ins-table-wrap">
            <table class="ins-table" id="gaTable">
              <thead>
                <tr>
                  <th data-i18n="colCategory"></th>
                  <th data-i18n="colBudget"></th>
                  <th data-i18n="colActual"></th>
                  <th data-i18n="colVariance"></th>
                </tr>
              </thead>
              <tbody id="gaBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer style="text-align:center; color:#94a3b8; font-size:12px; padding:16px;">실적분석 · China Branch Performance Analysis</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/echarts.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pptxgen.bundle.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-insights.js"></script>
<script src="js/common.js"></script>
<script src="js/app-insights.js"></script>
</body>
</html>
