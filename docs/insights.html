<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/insights-theme.css">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item" href="view.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
      <span class="app-nav-text" data-i18n="navPerfView"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="10" x2="10" y2="20"/></svg>
      <span class="app-nav-text" data-i18n="navTargetTable"></span>
    </a>
    <a class="app-nav-item" href="admin-kpi.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navKpi"></span>
    </a>
    <a class="app-nav-item active" href="insights.html" data-nav="insights">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
      <span class="app-nav-text" data-i18n="navInsights"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
<main>
  <div class="card" id="denyCard" style="display:none;">
    <h2 data-i18n="insightsDenied"></h2>
    <p class="desc" data-i18n="insightsDeniedDesc"></p>
    <div class="btn-row">
      <button class="btn-secondary" id="denyBackBtn" data-i18n="insightsDeniedBack"></button>
    </div>
  </div>

  <div id="insightsRoot">
    <div class="card">
      <h2 data-i18n="insightsHeading"></h2>
      <p class="desc" data-i18n="insightsDesc"></p>
      <div class="note-box" data-i18n="insightsHqOnlyNote" style="margin-bottom:16px;"></div>
      <div class="form-grid">
        <div>
          <label data-i18n="corp"></label>
          <select id="corpSelect"></select>
        </div>
        <div id="officeSelectWrap">
          <label data-i18n="office"></label>
          <select id="officeSelect"></select>
        </div>
        <div>
          <label data-i18n="yearmonth"></label>
          <select id="ymSwitch"></select>
        </div>
      </div>
      <div class="period-toggle" id="periodToggle">
        <button class="period-btn period-active" data-period="month" data-i18n="periodMonth">월간</button>
        <button class="period-btn" data-period="quarter" data-i18n="periodQuarter">분기</button>
        <button class="period-btn" data-period="year" data-i18n="periodYear">연간</button>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="exportPdfBtn" data-i18n="exportPdf"></button>
        <button class="btn-secondary" id="exportPptBtn" data-i18n="exportPpt"></button>
      </div>
    </div>

    <div id="captureArea">
      <div class="ins-stat-grid">
        <div class="ins-card">
          <p class="ins-stat-label" data-i18n="wfRevenue"></p>
          <p class="ins-stat-value" id="statRevenue">-</p>
          <span class="ins-badge neutral" id="statRevenueBadge"></span>
        </div>
        <div class="ins-card">
          <p class="ins-stat-label" data-i18n="wfOperatingProfit"></p>
          <p class="ins-stat-value" id="statOperatingProfit">-</p>
          <span class="ins-badge neutral" id="statOperatingMarginBadge"></span>
        </div>
        <div class="ins-card">
          <p class="ins-stat-label" data-i18n="statGaExecPct"></p>
          <p class="ins-stat-value" id="statGaExecPct">-</p>
          <div class="ins-progress"><div id="statGaExecBar" style="width:0%;"></div></div>
        </div>
      </div>

      <div class="ins-chart-grid">
        <div class="ins-card">
          <p class="ins-chart-title" data-i18n="waterfallHeading"></p>
          <div class="ins-chart-box" id="waterfallWrap"></div>
          <div class="ins-summary-row" id="waterfallSummary"></div>
        </div>
        <div class="ins-card">
          <p class="ins-chart-title" data-i18n="gaChartTitleDonut"></p>
          <div class="ins-chart-box" id="gaDonutWrap"></div>
        </div>
      </div>

      <div class="ins-card" style="margin-bottom:14px;">
        <p class="ins-chart-title" data-i18n="stabilityChartHeading"></p>
        <p class="desc" style="margin-bottom:10px;" data-i18n="stabilityChartDesc"></p>
        <div class="ins-chart-box small" id="stabilityWrap"></div>
      </div>

      <div class="ins-card">
        <p class="ins-chart-title" data-i18n="gaChartTitleBar"></p>
        <div class="note-box" id="gaEmptyNote" style="display:none; margin-top:0;"></div>
        <div class="ins-chart-box small" id="gaBarWrap"></div>
        <div class="ins-table-wrap">
          <table class="ins-table" id="gaTable">
            <thead>
              <tr>
                <th data-i18n="colCategory"></th>
                <th data-i18n="colBudget"></th>
                <th data-i18n="colActual"></th>
                <th data-i18n="colVariance"></th>
              </tr>
            </thead>
            <tbody id="gaBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
    </main>
    <footer>실적분석 · China Branch Performance Analysis</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/echarts.min.js"></script>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/pptxgen.bundle.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-insights.js"></script>
<script src="js/common.js"></script>
<script src="js/app-insights.js"></script>
</body>
</html>
