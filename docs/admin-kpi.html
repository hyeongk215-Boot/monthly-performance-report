<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실적분석</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item" href="view.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
      <span class="app-nav-text" data-i18n="navPerfView"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="10" x2="10" y2="20"/></svg>
      <span class="app-nav-text" data-i18n="navTargetTable"></span>
    </a>
    <a class="app-nav-item active" href="admin-kpi.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navKpi"></span>
    </a>
    <a class="app-nav-item" href="insights.html" data-nav="insights">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
      <span class="app-nav-text" data-i18n="navInsights"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
<main>
  <div class="card">
    <h2 data-i18n="kpiHeading"></h2>
    <p class="desc" data-i18n="kpiDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="aggHeading" style="font-size:18px;"></h2>
    <div class="form-grid">
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
      <button class="btn-secondary" id="downloadBtn" data-i18n="adminDownload"></button>
    </div>
    <div class="chart-wrap"><canvas id="aggChart"></canvas></div>
    <div class="table-wrap">
      <table class="exp-table num-table" id="aggTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="colCorp"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colOperatingMarginPct"></th>
            <th data-i18n="colNetMarginPct"></th>
            <th data-i18n="colDebtRatio"></th>
            <th data-i18n="colCurrentRatio"></th>
            <th data-i18n="colRoe"></th>
            <th data-i18n="colRoi"></th>
            <th data-i18n="colEquityRatio"></th>
            <th data-i18n="achievementLabel"></th>
            <th data-i18n="cashChangePct"></th>
            <th data-i18n="totalLoanBalanceCny"></th>
          </tr>
        </thead>
        <tbody id="aggBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="kpiDrilldownHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="kpiDrilldownDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="corp"></label>
        <select id="dCorp"></select>
      </div>
      <div>
        <label data-i18n="office"></label>
        <select id="dOffice"></select>
      </div>
      <div>
        <label data-i18n="yearmonth"></label>
        <select id="dYm"></select>
      </div>
    </div>
    <div class="period-toggle" id="dPeriodToggle">
      <button class="period-btn period-active" data-period="month" data-i18n="periodMonth">월간</button>
      <button class="period-btn" data-period="quarter" data-i18n="periodQuarter">분기</button>
      <button class="period-btn" data-period="year" data-i18n="periodYear">연간</button>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="dFetchBtn" data-i18n="adminFetch"></button>
      <button class="btn-secondary" id="wordBtn" data-i18n="wordExportBtn"></button>
    </div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="profitHeading"></h3>
    <div class="chart-wrap"><canvas id="dProfitChart"></canvas></div>
    <div class="table-wrap">
      <table class="exp-table num-table" id="dProfitTable">
        <thead>
          <tr>
            <th data-i18n="colMonth"></th>
            <th data-i18n="colRevenue"></th>
            <th data-i18n="colOperatingProfitKr"></th>
            <th data-i18n="colNetProfit"></th>
            <th data-i18n="colOperatingMarginPct"></th>
            <th data-i18n="colNetMarginPct"></th>
          </tr>
        </thead>
        <tbody id="dProfitBody"></tbody>
      </table>
    </div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="stabilityHeading"></h3>
    <div class="table-wrap">
      <table class="exp-table num-table" id="dStabilityTable">
        <thead>
          <tr>
            <th data-i18n="colMonth"></th>
            <th data-i18n="colDebtRatio"></th>
            <th data-i18n="colCurrentRatio"></th>
          </tr>
        </thead>
        <tbody id="dStabilityBody"></tbody>
      </table>
    </div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="financialRatioHeading"></h3>
    <p class="desc" data-i18n="financialRatioCorpOnlyNote"></p>
    <div class="metric-cards">
      <div class="metric-card"><div class="label" data-i18n="colRoe"></div><div class="value" id="dRoe">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colRoi"></div><div class="value" id="dRoi">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colDebtRatio"></div><div class="value" id="dDebtRatio">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colEquityRatio"></div><div class="value" id="dEquityRatio">-</div></div>
    </div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="budgetHeading"></h3>
    <div class="metric-cards">
      <div class="metric-card"><div class="label" data-i18n="targetProfitLabel"></div><div class="value" id="dTargetProfitCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="actualProfitLabel"></div><div class="value" id="dActualProfitCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="achievementLabel"></div><div class="value" id="dProfitAchievementPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colSalesMarginPct"></div><div class="value" id="dSalesMarginPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colOperatingMarginPct"></div><div class="value" id="dOperatingMarginPct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="colNetMarginPct"></div><div class="value" id="dNetMarginPct">-</div></div>
    </div>

    <h3 style="font-size:14px; margin-top:18px;" id="dFundHeading" data-i18n="fundHeading"></h3>
    <p class="desc" data-i18n="fundCorpOnlyNote"></p>
    <div class="metric-cards" id="dFundCards">
      <div class="metric-card"><div class="label" data-i18n="endingCny"></div><div class="value" id="dFundEndingCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="prevEndingCny"></div><div class="value" id="dFundPrevEndingCny">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="cashChangePct"></div><div class="value" id="dFundChangePct">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="totalLoanBalanceCny"></div><div class="value" id="dFundLoanBalance">-</div></div>
      <div class="metric-card"><div class="label" data-i18n="dividendAvailableCny"></div><div class="value" id="dFundDividend">-</div></div>
    </div>
  </div>
    </main>
    <footer>실적분석 · China Branch Performance Analysis</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/chart.umd.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin-kpi.js"></script>
</body>
</html>
